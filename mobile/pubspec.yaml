name: lectio_mobile
description: Lectio Flutter mobile client
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  file_picker: ^13.3.3
  record: ^7.1.2
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  archive: ^4.6.0
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/offline-reader/index.html
    - assets/offline-reader/assets/reader.js
    - assets/offline-reader/assets/reader.css
